plugins { id 'com.android.application' }
android {
    namespace 'ru.whoosh.proto'
    compileSdk 34
    defaultConfig {
        applicationId 'ru.whoosh.proto'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'ver'
    productFlavors {
        v1 {
            dimension 'ver'
            resValue 'string', 'app_name', 'Whoosh'
            buildConfigField 'String', 'START_URL', '"https://alena-vii-v.github.io/w_prototype/"'
        }
        v2 {
            dimension 'ver'
            applicationIdSuffix '.v2'
            resValue 'string', 'app_name', 'Whoosh 2'
            buildConfigField 'String', 'START_URL', '"https://alena-vii-v.github.io/w_prototype/v2/"'
        }
        v4 {
            dimension 'ver'
            applicationIdSuffix '.v4'
            resValue 'string', 'app_name', 'Whoosh 4'
            buildConfigField 'String', 'START_URL', '"https://alena-vii-v.github.io/w_prototype/v4/"'
        }
    }
}
